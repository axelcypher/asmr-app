name: Server

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "server/**"
      - "shared/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - "shared/**"
  workflow_dispatch:

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/asmr-server

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # Kein Image aus einem Commit mit roten Tests.
      - name: Tests und Distribution
        run: ./gradlew :server:test :server:installDist

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v7
        with:
          context: server
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Setzt den neuen Image-Tag in gitops-homelab; Komodo deployt per Resource Sync.
  deploy:
    needs: image
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    env:
      DEPLOY_TOKEN: ${{ secrets.GITOPS_DEPLOY_TOKEN }}
      ENV_FILE: apps/docker/asmr-server/prod.env
      IMAGE_KEY: ASMR_SERVER_IMAGE_VERSION
      IMAGE_TAG: ${{ needs.image.outputs.tag }}
    steps:
      - name: Kein Deploy-Token
        if: env.DEPLOY_TOKEN == ''
        run: echo "::warning::Secret GITOPS_DEPLOY_TOKEN fehlt, Deployment-Repo wird nicht aktualisiert"

      - uses: actions/checkout@v7
        if: env.DEPLOY_TOKEN != ''
        with:
          repository: axelcypher/gitops-homelab
          token: ${{ env.DEPLOY_TOKEN }}
          path: gitops

      - name: Image-Tag setzen und pushen
        if: env.DEPLOY_TOKEN != ''
        working-directory: gitops
        run: |
          test -f "$ENV_FILE"
          if grep -q "^$IMAGE_KEY=" "$ENV_FILE"; then
            sed -i "s|^$IMAGE_KEY=.*|$IMAGE_KEY=$IMAGE_TAG|" "$ENV_FILE"
          else
            echo "$IMAGE_KEY=$IMAGE_TAG" >> "$ENV_FILE"
          fi
          git add -- "$ENV_FILE"
          if git diff --cached --quiet; then
            echo "Deployment-Repo verweist bereits auf $IMAGE_TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: deploy asmr-server ${GITHUB_SHA::12}"
          git push origin HEAD:main
