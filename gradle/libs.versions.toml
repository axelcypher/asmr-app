[versions]
agp = "9.4.1"
kotlin = "2.4.20"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
browser = "1.10.0"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
media3 = "1.11.1"
datastore = "1.2.1"
